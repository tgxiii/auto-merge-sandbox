name: Auto squash-merge

on:
  pull_request:
    types: [labeled]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          event_name="${{ github.event_name }}"

          evaluate_and_merge() {
            local pr_number="$1"
            local has_required_label_pair checks_evaluation checks_status=0

            if ! has_required_label_pair="$(
              gh pr view "$pr_number" \
                --repo "$GH_REPO" \
                --json labels \
                --jq '
                  [.labels[].name] as $labels
                  | (
                      (($labels | index("author:codex")) != null)
                      and (($labels | index("review:claude")) != null)
                    )
                    or (
                      (($labels | index("author:claude")) != null)
                      and (($labels | index("review:codex")) != null)
                    )
                '
              )"; then
              echo "PR #$pr_number: unable to fetch labels; skipping."
              return 0
            fi

            if [[ "$has_required_label_pair" != "true" ]]; then
              echo "PR #$pr_number: lacks a required label pair (author:codex with review:claude, or author:claude with review:codex); skipping."
              return 0
            fi

            checks_evaluation="$(
              gh pr checks "$pr_number" \
                --repo "$GH_REPO" \
                --json name,state \
                --jq '
                  [.[] | select(.name != "merge")] as $checks
                  | if ($checks | length) == 0 then
                      "none"
                    elif all($checks[]; .state == "SUCCESS" or .state == "SKIPPED") then
                      "ready"
                    else
                      "blocked: "
                      + (
                          [
                            $checks[]
                            | select(.state != "SUCCESS" and .state != "SKIPPED")
                            | "\(.name)=\(.state)"
                          ]
                          | join(", ")
                        )
                    end
                '
            )" || checks_status=$?

            if [[ -z "$checks_evaluation" ]]; then
              echo "PR #$pr_number: unable to evaluate checks (gh exited with status $checks_status); skipping."
              return 0
            fi

            if [[ "$checks_evaluation" == "none" ]]; then
              echo "PR #$pr_number: has no checks other than the merge check; skipping."
              return 0
            fi

            if [[ "$checks_evaluation" != "ready" ]]; then
              echo "PR #$pr_number: checks not all SUCCESS or SKIPPED ($checks_evaluation); skipping."
              return 0
            fi

            echo "PR #$pr_number: label pair present and all checks green; attempting squash merge."
            gh pr merge "$pr_number" --repo "$GH_REPO" --squash || true
          }

          if [[ "$event_name" == "pull_request" ]]; then
            evaluate_and_merge "${{ github.event.pull_request.number }}"
          else
            open_prs="$(
              gh pr list \
                --repo "$GH_REPO" \
                --state open \
                --json number \
                --jq '.[].number'
            )"
            if [[ -z "$open_prs" ]]; then
              echo "No open pull requests; nothing to evaluate."
              exit 0
            fi
            for pr in $open_prs; do
              evaluate_and_merge "$pr"
            done
          fi
