name: Auto squash-merge

on:
  pull_request:
    types: [labeled]
  check_suite:
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          event_name="${{ github.event_name }}"

          if [[ "$event_name" == "pull_request" ]]; then
            pr_number="${{ github.event.pull_request.number }}"
          elif [[ "$event_name" == "check_suite" ]]; then
            head_sha="${{ github.event.check_suite.head_sha }}"
            if ! pr_number="$(
              gh pr list \
                  --repo "$GH_REPO" \
                  --state open \
                  --search "$head_sha" \
                  --json number \
                  --jq '.[0].number // empty'
              )"; then
              echo "Unable to search for an open pull request with check-suite head SHA $head_sha; skipping merge."
              exit 0
            fi

            if [[ -z "$pr_number" ]]; then
              echo "No open pull request found for check-suite head SHA $head_sha; skipping merge."
              exit 0
            fi
          else
            echo "Unsupported event '$event_name'; skipping merge."
            exit 0
          fi

          if ! has_required_label_pair="$(
            gh pr view "$pr_number" \
              --repo "$GH_REPO" \
              --json labels \
              --jq '
                [.labels[].name] as $labels
                | (
                    (($labels | index("author:codex")) != null)
                    and (($labels | index("review:claude")) != null)
                  )
                  or (
                    (($labels | index("author:claude")) != null)
                    and (($labels | index("review:codex")) != null)
                  )
              '
            )"; then
            echo "Unable to fetch labels for PR #$pr_number; skipping merge."
            exit 0
          fi

          if [[ "$has_required_label_pair" != "true" ]]; then
            echo "PR #$pr_number lacks an exact required label pair: author:codex with review:claude, or author:claude with review:codex; skipping merge."
            exit 0
          fi

          checks_status=0
          checks_evaluation="$(
            gh pr checks "$pr_number" \
              --repo "$GH_REPO" \
              --json name,state \
              --jq '
                [.[] | select(.name != "merge")] as $checks
                | if ($checks | length) == 0 then
                    "none"
                  elif all($checks[]; .state == "SUCCESS" or .state == "SKIPPED") then
                    "ready"
                  else
                    "blocked: "
                    + (
                        [
                          $checks[]
                          | select(.state != "SUCCESS" and .state != "SKIPPED")
                          | "\(.name)=\(.state)"
                        ]
                        | join(", ")
                      )
                  end
              '
          )" || checks_status=$?

          if [[ -z "$checks_evaluation" ]]; then
            echo "Unable to evaluate checks for PR #$pr_number (gh exited with status $checks_status); skipping merge."
            exit 0
          fi

          if [[ "$checks_evaluation" == "none" ]]; then
            echo "PR #$pr_number has no checks other than the merge check; skipping merge."
            exit 0
          fi

          if [[ "$checks_evaluation" != "ready" ]]; then
            echo "PR #$pr_number has checks that are not SUCCESS or SKIPPED ($checks_evaluation); skipping merge."
            exit 0
          fi

          echo "PR #$pr_number has an approved label pair and all required checks are green; attempting squash merge."
          gh pr merge "$pr_number" --repo "$GH_REPO" --squash || true
