name: Auto squash-merge

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

concurrency:
  group: auto-squash-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REQUIRED_CHECKS: ''
    steps:
      - name: Merge eligible pull requests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          evaluate_and_merge() {
            local pr_number="$1"
            local pr_metadata=""
            local is_draft=""
            local head_commit=""
            local has_author_codex=""
            local has_author_claude=""
            local has_review_codex=""
            local has_review_claude=""
            local checks_json=""
            local checks_status=0
            local blocked_checks=""
            local normalized_required_checks=""
            local required_check=""
            local -a required_check_names=()

            # jq variables must remain literal inside the single-quoted filter.
            # shellcheck disable=SC2016
            if ! pr_metadata="$(
              gh pr view "$pr_number" \
                --repo "$GH_REPO" \
                --json headRefOid,isDraft,labels \
                --jq '
                  [.labels[].name] as $labels
                  | [
                      .isDraft,
                      .headRefOid,
                      (($labels | index("author:codex")) != null),
                      (($labels | index("author:claude")) != null),
                      (($labels | index("review:codex")) != null),
                      (($labels | index("review:claude")) != null)
                    ]
                  | @tsv
                '
            )"; then
              echo "PR #$pr_number: unable to fetch pull request metadata; skipping merge."
              return 0
            fi

            IFS=$'\t' read -r \
              is_draft \
              head_commit \
              has_author_codex \
              has_author_claude \
              has_review_codex \
              has_review_claude <<< "$pr_metadata"

            if [[ "$is_draft" == "true" ]]; then
              echo "PR #$pr_number: pull request is a draft; skipping merge."
              return 0
            fi

            if [[ "$has_author_codex" == "true" && "$has_author_claude" == "true" ]]; then
              echo "PR #$pr_number: both author labels are present; refusing to merge."
              return 0
            fi

            if ! {
              [[ "$has_author_codex" == "true" && "$has_review_claude" == "true" ]] ||
                [[ "$has_author_claude" == "true" && "$has_review_codex" == "true" ]]
            }; then
              echo "PR #$pr_number: lacks a cross-vendor author and review label pair; skipping merge."
              return 0
            fi

            checks_json="$(
              gh pr checks "$pr_number" \
                --repo "$GH_REPO" \
                --json name,state,workflow
            )" || checks_status=$?

            if [[ -z "$checks_json" ]]; then
              echo "PR #$pr_number: unable to evaluate checks (gh exited with status $checks_status); skipping merge."
              return 0
            fi

            if ! checks_json="$(
              jq \
                --arg current_workflow "$GITHUB_WORKFLOW" \
                '[.[] | select(.workflow != $current_workflow)]' \
                <<< "$checks_json"
            )"; then
              echo "PR #$pr_number: check data was not valid JSON; skipping merge."
              return 0
            fi

            if [[ "$(jq 'length' <<< "$checks_json")" -eq 0 ]]; then
              echo "PR #$pr_number: has no checks from another workflow; skipping merge."
              return 0
            fi

            if ! jq -e 'any(.[]; .state == "SUCCESS")' <<< "$checks_json" >/dev/null; then
              echo "PR #$pr_number: no check from another workflow has an actual SUCCESS state; skipping merge."
              return 0
            fi

            if jq -e \
              'any(.[]; .state != "SUCCESS" and .state != "SKIPPED")' \
              <<< "$checks_json" >/dev/null; then
              blocked_checks="$(
                jq -r '
                  [
                    .[]
                    | select(.state != "SUCCESS" and .state != "SKIPPED")
                    | "\(.name)=\(.state)"
                  ]
                  | join(", ")
                ' <<< "$checks_json"
              )"
              echo "PR #$pr_number: checks are not all SUCCESS or SKIPPED ($blocked_checks); skipping merge."
              return 0
            fi

            normalized_required_checks="${REQUIRED_CHECKS//,/ }"
            read -r -a required_check_names <<< "$normalized_required_checks"

            for required_check in "${required_check_names[@]}"; do
              if ! jq -e \
                --arg required_check "$required_check" \
                'any(.[]; .name == $required_check and .state == "SUCCESS")' \
                <<< "$checks_json" >/dev/null; then
                echo "PR #$pr_number: required check '$required_check' is missing or not SUCCESS; skipping merge."
                return 0
              fi
            done

            echo "PR #$pr_number: eligibility gates passed; attempting squash merge of $head_commit."
            if gh pr merge "$pr_number" \
              --repo "$GH_REPO" \
              --squash \
              --delete-branch \
              --match-head-commit "$head_commit"; then
              echo "PR #$pr_number: squash merge completed."
            else
              echo "PR #$pr_number: merge failed; a later scheduled or manual sweep will retry."
            fi
          }

          pr_numbers="$(
            gh pr list \
              --repo "$GH_REPO" \
              --state open \
              --limit 100 \
              --json number \
              --jq '.[].number'
          )"

          if [[ -z "$pr_numbers" ]]; then
            echo "No open pull requests; nothing to evaluate."
            exit 0
          fi

          if [[ "$(wc -l <<< "$pr_numbers")" -ge 100 ]]; then
            echo "Warning: 100 or more open pull requests; some may not have been evaluated this sweep."
          fi

          while IFS= read -r pr_number; do
            evaluate_and_merge "$pr_number"
          done <<< "$pr_numbers"
